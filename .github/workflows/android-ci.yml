name: Android CI and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ARMv7 APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Add G.I KO KO launcher icon
        run: |
          set -e
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "app/src/main/res/mipmap-$density"
            curl -fL "https://raw.githubusercontent.com/gikoko611/G-Ikoko-Manager/main/app/src/main/res/mipmap-$density/ic_launcher.png" -o "app/src/main/res/mipmap-$density/ic_launcher.png"
          done

      - name: Fetch llama.cpp native inference engine
        run: |
          git clone --depth 1 --branch v0.6.0 --recurse-submodules --shallow-submodules https://github.com/ggml-org/llama.cpp.git third_party/llama.cpp
          test -f third_party/llama.cpp/CMakeLists.txt
          git clone --depth 1 --branch v1.9.5 --recurse-submodules --shallow-submodules https://github.com/ggml-org/whisper.cpp.git third_party/whisper.cpp
          test -f third_party/whisper.cpp/CMakeLists.txt

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify ARMv7 offline native library in release APK
        run: |
          set -e
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/libgi_llama.so'
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/libgi_whisper.so'
          echo "Verified ARMv7 llama.cpp + whisper.cpp native libraries: $APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GI-KO-KO-Voice-Assistant-debug-armv7
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: GI-KO-KO-Voice-Assistant-v0.4.0-whisper-burmese-armv7
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
