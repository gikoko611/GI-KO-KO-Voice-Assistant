name: Myanmar TTS Model Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-sample:
    name: Verify Burmese TTS model on CPU
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install MyanmarTTS
        run: |
          python -m pip install --upgrade pip
          python -m pip install MyanmarTTS

      - name: Generate Burmese sample on CPU
        env:
          HF_HOME: ${{ runner.temp }}/hf-cache
        run: |
          python tools/myanmar_tts_smoke_test.py

      - name: Upload generated WAV and report
        uses: actions/upload-artifact@v4
        with:
          name: myanmar-tts-cpu-smoke-test
          path: |
            build/myanmar-tts-smoke/
          if-no-files-found: error
          retention-days: 7
